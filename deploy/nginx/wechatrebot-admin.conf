# Include only in the existing HTTPS server block; HTTP must redirect to HTTPS.
location = /wechatrebot-admin {
    return 308 /wechatrebot-admin/;
}

location = /wechatrebot-admin/login {
    client_max_body_size 16k;
    client_body_timeout 10s;
    limit_req zone=wechatrebot_admin_login burst=5 nodelay;
    limit_req_status 429;
    access_log off;
    proxy_pass http://127.0.0.1:8092/login;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
}

location ^~ /wechatrebot-admin/ {
    client_max_body_size 1m;
    client_body_timeout 10s;
    limit_req zone=wechatrebot_admin burst=20 nodelay;
    limit_req_status 429;
    access_log off;
    proxy_pass http://127.0.0.1:8092/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    # A stable switch verifies the full public package before promotion.
    proxy_read_timeout 1900s;
}

# Stream signed packages to the service after its CSRF/TOTP fields are checked.
location = /wechatrebot-admin/releases/upload {
    client_max_body_size 4100m;
    client_body_timeout 30s;
    limit_req zone=wechatrebot_admin burst=2 nodelay;
    limit_req_status 429;
    access_log off;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8092/releases/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 7500s;
}
