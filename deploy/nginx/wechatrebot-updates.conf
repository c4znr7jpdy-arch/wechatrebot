# Included inside the HTTPS server block for ss.xiuxianjyj.xin.
# Serves the public download page, its generated release metadata, and signed updates.
location = /wechatrebot-updates {
    return 301 /wechatrebot-updates/;
}

location = /wechatrebot-updates/ {
    alias /srv/wechatrebot-updates/site/;
    index index.html;
}

# The index module internally redirects the directory URI here. Keeping this
# location internal preserves the clean public URL while serving one exact file.
location = /wechatrebot-updates/index.html {
    internal;
    alias /srv/wechatrebot-updates/site/index.html;
    default_type text/html;
    charset utf-8;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location = /wechatrebot-updates/download.json {
    alias /srv/wechatrebot-updates/download.json;
    default_type application/json;
    charset utf-8;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /wechatrebot-updates/downloads/ {
    alias /srv/wechatrebot-updates/downloads/;
    types {
        application/zip zip;
        text/plain sha256;
    }
    default_type application/octet-stream;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location = /wechatrebot-updates/stable.json {
    alias /srv/wechatrebot-updates/stable.json;
    default_type application/json;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /wechatrebot-updates/releases/ {
    alias /srv/wechatrebot-updates/releases/;
    default_type application/zip;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
