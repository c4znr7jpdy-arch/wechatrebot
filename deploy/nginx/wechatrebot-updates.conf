# Included inside the HTTPS server block for ss.xiuxianjyj.xin.
# Keep the manual download page private while serving release metadata and signed updates.
location = /wechatrebot-updates {
    return 404;
}

location = /wechatrebot-updates/ {
    return 404;
}

location = /wechatrebot-updates/index.html {
    return 404;
}

location = /wechatrebot-updates/site {
    return 404;
}

location ^~ /wechatrebot-updates/site/ {
    return 404;
}

location = /wechatrebot-updates/download.json {
    alias /srv/wechatrebot-updates/download.json;
    default_type application/json;
    charset utf-8;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /wechatrebot-updates/downloads/ {
    alias /srv/wechatrebot-updates/downloads/;
    types {
        application/zip zip;
        text/plain sha256;
    }
    default_type application/octet-stream;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location = /wechatrebot-updates/stable.json {
    alias /srv/wechatrebot-updates/stable.json;
    default_type application/json;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /wechatrebot-updates/releases/ {
    alias /srv/wechatrebot-updates/releases/;
    default_type application/zip;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
