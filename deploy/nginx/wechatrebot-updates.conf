# Included inside the HTTPS server block for ss.xiuxianjyj.xin.
# Only signed manifests and immutable release archives are exposed.
location = /wechatrebot-updates/stable.json {
    alias /srv/wechatrebot-updates/stable.json;
    default_type application/json;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /wechatrebot-updates/releases/ {
    alias /srv/wechatrebot-updates/releases/;
    default_type application/zip;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location = /wechatrebot-updates/ {
    return 404;
}
