[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatrebot-manager"
version = "1.0.27"
description = "Windows bootstrap and release tooling for WeChat ReBot"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography==48.0.0",
    "packaging==26.3",
    "pywebview==6.2.1",
    "tzdata==2026.4",
]

[project.optional-dependencies]
test = [
    "beautifulsoup4==4.14.3",
    "qrcode==8.2",
    "aiohttp==3.13.5",
    "httpx[http2]==0.28.1",
    "h2==4.3.0",
    "openai==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "pillow==12.2.0",
    "playwright==1.60.0",
    "websockets==15.0.1",
    "tenacity==9.1.4",
    "pytest==8.4.2",
    "Jinja2==3.1.6",
    "pytest-asyncio==1.4.1.post1",
    "unicorn==2.1.4",
    "keystone-engine==0.9.2",
]

[project.scripts]
wechatrebot-manager = "wechatrebot_manager.cli:main"

[project.gui-scripts]
wechatrebot = "wechatrebot_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechatrebot_manager = ["*.json", "plugin_webui/*.html", "plugin_webui/*.css", "plugin_webui/*.js", "app_webui/*.html", "app_webui/*.css", "app_webui/*.js", "app_webui/*.json", "app_webui/assets/*.woff2", "app_webui/assets/app-icon.*", "app_webui/assets/help-*.webp", "app_webui/assets/report-preview-*.webp", "app_webui/assets/provider-*.png", "app_webui/assets/provider-*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
