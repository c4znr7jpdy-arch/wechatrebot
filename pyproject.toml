[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatrebot-manager"
version = "0.9.9"
description = "Windows bootstrap and release tooling for WeChat ReBot"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography==48.0.0",
    "packaging==26.3",
    "pywebview==6.2.1",
    "tzdata==2026.4",
]

[project.optional-dependencies]
test = [
    "aiohttp==3.13.5",
    "httpx==0.28.1",
    "pillow==12.2.0",
    "websockets==15.0.1",
    "pytest>=8,<9",
    "Jinja2>=3.1.6,<4",
    "pytest-asyncio>=0.24,<2",
    "unicorn==2.1.4",
    "keystone-engine==0.9.2",
]

[project.scripts]
wechatrebot-manager = "wechatrebot_manager.cli:main"

[project.gui-scripts]
wechatrebot = "wechatrebot_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechatrebot_manager = ["*.json", "plugin_webui/*.html", "plugin_webui/*.css", "plugin_webui/*.js", "app_webui/*.html", "app_webui/*.css", "app_webui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
