[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatrebot-manager"
version = "0.1.0"
description = "Windows bootstrap and release tooling for WeChat ReBot"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
wechatrebot-manager = "wechatrebot_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

