      };

      const expandSelectionItem = (rawItem) => {
        const item = rawItem && typeof rawItem === 'object' ? rawItem : {};
        const pattern = item.episode_name_pattern;
        let episodeNames = Array.isArray(item.episode_names)
          ? item.episode_names
          : [];
        if (!episodeNames.length && pattern && typeof pattern === 'object') {
          const start = Number(pattern.start);
          const count = Number(pattern.count);
          const pad = Math.max(0, Number(pattern.pad) || 0);
          if (Number.isInteger(start) && Number.isInteger(count) && count > 0 && count <= 2000) {
            episodeNames = Array.from({ length: count }, (_unused, index) => {
              const number = String(start + index).padStart(pad, '0');
              return `${String(pattern.prefix || '')}${number}${String(pattern.suffix || '')}`;
            });
          }
        }
        if (!Array.isArray(item.episodes)
          && item.episode_template
          && episodeNames.length) {
          const template = String(item.episode_template);
          item.episodes = episodeNames.map((name) => ({
            name: String(name || ''),
            url: template.replaceAll('{name}', String(name || '')),
          }));
        }
        if (!Array.isArray(item.episodes)
          && item.episode_url_template
          && Array.isArray(item.episode_url_values)) {
          const template = String(item.episode_url_template);
          item.episodes = item.episode_url_values.map((value, index) => ({
            name: String(episodeNames[index] || `第${index + 1}集`),
            url: template.replaceAll('{value}', String(value || '')),
          }));
        }
        if (!Array.isArray(item.episodes)) item.episodes = [];
        const declaredCount = Number(item.episode_count);
        item.episodeCount = Number.isFinite(declaredCount) && declaredCount > 0
          ? declaredCount
          : item.episodes.length;
        return item;
      };

      try {
        if (params.get('s')) {
          const response = await fetch(`/short-drama/api/selections/${encodeURIComponent(params.get('s'))}`, { cache: 'no-store', credentials: 'omit' });
          const payload = await response.json();
          if (!response.ok || !payload || payload.v !== 1) throw new Error(payload?.error || '选集链接已过期');
          recommendationItems = Array.isArray(payload.items)
            ? payload.items.map(expandSelectionItem).filter((item) => item.episodes.length)
            : [];
          selectionKind = String(payload.kind || 'recommendations');
          recommendationsTitle.textContent = String(payload.heading || '选择作品');
          document.title = recommendationsTitle.textContent;
          watchStage.hidden = true;
        } else if (fragment.get('r')) {
          const payload = decodePlaylist(fragment.get('r'));
          recommendationItems = Array.isArray(payload.items)
            ? payload.items.map(expandSelectionItem).filter((item) => item.episodes.length)
            : [];
          selectionKind = String(payload.kind || 'recommendations');
          recommendationsTitle.textContent = String(payload.heading || '选择作品');
          document.title = recommendationsTitle.textContent;
          watchStage.hidden = true;
        } else if (fragment.get('p')) {
          playlist = decodePlaylist(fragment.get('p'));
        } else {
          playlist = {
            v: 1,
            title: (params.get('title') || '短剧播放').trim(),
            source: '',
            episodes: [{
              name: (params.get('episode') || '正片').trim(),
              url: (params.get('url') || '').trim()
            }]
          };
        }
      } catch (_error) {
        fail('分集数据已损坏，请回到微信重新搜索。');
        return;
      }

      if (!recommendationItems.length && (!playlist || !Array.isArray(playlist.episodes) || !playlist.episodes.length)) {
        fail('没有可播放的分集，请回到微信重新搜索。');
        return;
      }
      if (playlist) titleNode.textContent = String(playlist.title || '短剧播放');

      const updateButtons = () => {
        if (!playlist) {
          previous.disabled = true;
          next.disabled = true;
          return;
        }
        previous.disabled = current <= 0;
        next.disabled = current >= playlist.episodes.length - 1;
        const label = String(playlist.episodes[current]?.name || `第${current + 1}集`);
        currentEpisode.textContent = label;
        mobileEpisodeLabel.textContent = label;
        mobileEpisodeLabelTop.textContent = label;
        episodeGrid.querySelectorAll('button').forEach((button, index) => {
          button.classList.toggle('active', index === current);
        });
        sheetEpisodeGrid.querySelectorAll('button').forEach((button, index) => {
          button.classList.toggle('active', index === current);
        });
      };

      const videoAspectMode = (width, height) => {
        const ratio = Number(width) / Number(height);
        if (!Number.isFinite(ratio) || ratio <= 0) return 'landscape';
        if (ratio >= 1.9) return 'cinema';
        if (ratio >= 1.2) return 'landscape';
        if (ratio >= 0.8) return 'square';
        return 'portrait';
      };

      const resetVideoAspect = () => {
        videoShell.classList.remove(...VIDEO_ASPECT_CLASSES);
        videoShell.classList.add('player--landscape');
        videoShell.style.removeProperty('--video-aspect');
        videoShell.style.removeProperty('--inline-stage-width');
      };

      const applyVideoAspect = () => {
        if (document.fullscreenElement === videoShell || videoShell.classList.contains('pseudo-fullscreen')) return;
        if (!video.videoWidth || !video.videoHeight) return;
        const ratio = video.videoWidth / video.videoHeight;
        const mode = videoAspectMode(video.videoWidth, video.videoHeight);
        videoShell.classList.remove(...VIDEO_ASPECT_CLASSES);
        videoShell.classList.add(`player--${mode}`);
        videoShell.style.removeProperty('--video-aspect');
        videoShell.style.removeProperty('--inline-stage-width');
        if (mode === 'cinema' || mode === 'landscape') return;
        const viewportHeight = window.visualViewport?.height || window.innerHeight;
        const maxHeight = Math.max(1, viewportHeight * .68);
        const availableWidth = Math.max(1, videoShell.parentElement?.clientWidth || 0);
        const stageWidth = Math.min(availableWidth, maxHeight * ratio);
        videoShell.style.setProperty('--video-aspect', String(ratio));
        videoShell.style.setProperty('--inline-stage-width', `${stageWidth}px`);
      };

      const syncNativeControls = () => {
        video.controls = true;
        clearControlsHideTimer();
        videoActions.classList.remove('controls-hidden');
      };

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        const value = Math.floor(seconds);
        const hours = Math.floor(value / 3600);
        const minutes = Math.floor((value % 3600) / 60);
        const rest = String(value % 60).padStart(2, '0');
        return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
      };

      const updateMobileProgress = () => {
        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        const currentTime = Number.isFinite(video.currentTime) ? video.currentTime : 0;
        mobileCurrentTime.textContent = formatTime(currentTime);
        mobileDuration.textContent = formatTime(duration);
        const ratio = duration > 0 ? Math.min(1, Math.max(0, currentTime / duration)) : 0;
        mobileSeek.value = String(Math.round(ratio * 1000));
        mobileSeek.style.setProperty('--seek-progress', `${ratio * 100}%`);
      };

      const levelName = (level) => {
        if (level?.height) return `${level.height}P`;
        if (level?.bitrate) return `${Math.round(level.bitrate / 1000)}K`;
        return '清晰度';
      };

      const updateQualityActive = (forcedLevel = null) => {
        const manualLevel = hls && !hls.autoLevelEnabled
          ? (hls.currentLevel >= 0 ? hls.currentLevel : forcedLevel)
          : null;
        qualityMenu.querySelectorAll('button').forEach((button) => {
          const autoActive = button.dataset.level === 'auto' && hls?.autoLevelEnabled;
          const levelActive = button.dataset.level !== 'auto'
            && !hls?.autoLevelEnabled
            && Number(button.dataset.level) === manualLevel;
          button.classList.toggle('active', Boolean(autoActive || levelActive));
        });
        const selectedLevel = manualLevel ?? hls?.currentLevel;
        const selected = Number.isInteger(selectedLevel) && selectedLevel >= 0
          ? hls?.levels[selectedLevel]
          : null;
        qualityLabel.textContent = hls && hls.levels.length > 1
          ? (hls.autoLevelEnabled ? '自动' : levelName(selected))
          : '原画';
      };

      const chooseQuality = (value) => {
        if (!hls) return;
        if (value === 'auto') hls.currentLevel = -1;
        else if (hls.levels[Number(value)]) hls.currentLevel = Number(value);
        else return;
        qualityMenu.hidden = true;
        updateQualityActive(value === 'auto' ? null : Number(value));
        showControls();
      };

      const setupQualityMenu = () => {
        qualityMenu.replaceChildren();
        const levels = hls?.levels || [];
        qualityButton.disabled = levels.length <= 1;
        if (levels.length <= 1) {
          qualityLabel.textContent = '原画';
          return;
        }
        const entries = [
          { index: 'auto', label: '自动' },
          ...levels.map((level, index) => ({ index: String(index), label: levelName(level) })).reverse(),
        ];
        entries.forEach((entry) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.level = entry.index;
          button.textContent = entry.label;
          button.addEventListener('click', () => chooseQuality(entry.index));
          qualityMenu.appendChild(button);
        });
        hls.currentLevel = -1;
        updateQualityActive();
      };

      const isInlineMobile = () => mobileLayoutQuery.matches
        && !document.fullscreenElement
        && !videoShell.classList.contains('pseudo-fullscreen');

      const clearControlsHideTimer = () => {
        if (controlsHideTimer) {
          clearTimeout(controlsHideTimer);
          controlsHideTimer = null;
        }
      };

      const scheduleControlsHide = () => {
        clearControlsHideTimer();
        if (!isInlineMobile() || video.paused || controlsPointerActive || !mobileMoreMenu.hidden || !qualityMenu.hidden) return;
        controlsHideTimer = setTimeout(() => {
          if (!video.paused && !controlsPointerActive && mobileMoreMenu.hidden && qualityMenu.hidden) {
            videoActions.classList.add('controls-hidden');
          }
          controlsHideTimer = null;
        }, 2800);
      };

      const showControls = () => {
        videoActions.classList.remove('controls-hidden');
        scheduleControlsHide();
      };

      const hideControls = () => {
        clearControlsHideTimer();
        if (isInlineMobile() && !video.paused && !controlsPointerActive && mobileMoreMenu.hidden && qualityMenu.hidden) {
          videoActions.classList.add('controls-hidden');
        }
      };

      const updatePlaybackOverlay = () => {
        if (playbackOverlayTimer) {
          clearTimeout(playbackOverlayTimer);
          playbackOverlayTimer = null;
        }
        playbackOverlay.hidden = false;
        playbackOverlay.classList.toggle('is-playing', !video.paused);
        if (video.paused) showControls();
        else scheduleControlsHide();
      };

      const openEpisodeSheet = () => {
        if (!playlist || playlist.episodes.length < 2) return;
        qualityMenu.hidden = true;
        mobileMoreMenu.hidden = true;
        episodeSheet.hidden = false;
        document.body.classList.add('sheet-open');
      };

      const closeEpisodeSheet = () => {
        episodeSheet.hidden = true;
        document.body.classList.remove('sheet-open');
      };

      const toggleFullscreen = async () => {
        const shell = videoShell;
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (shell.classList.contains('pseudo-fullscreen')) shell.classList.remove('pseudo-fullscreen');
          else if (shell.requestFullscreen) await shell.requestFullscreen();
          else shell.classList.add('pseudo-fullscreen');
        } catch (_error) { /* 微信内置浏览器可能不允许原生全屏 */ }
        applyVideoAspect();
        syncNativeControls();
      };

      const loadEpisode = (index) => {
        if (!playlist) return;
        if (index < 0 || index >= playlist.episodes.length) return;
        current = index;
        const item = playlist.episodes[current] || {};
        const source = String(item.url || '').trim();
        episodeNode.textContent = String(item.name || `第${current + 1}集`);
        fallback.href = `https://m3u8-player.cc/player?url=${encodeURIComponent(source)}`;
        statusNode.classList.remove('error');
        statusNode.textContent = '正在连接资源站……';
        if (loadTimer) clearTimeout(loadTimer);
        loadTimer = setTimeout(() => {
          fail('资源站响应超时，可能不允许浏览器直连。请点击“线路”使用备用播放器。');
        }, 15000);
        if (hls) { hls.destroy(); hls = null; }
        qualityMenu.hidden = true;
        qualityMenu.replaceChildren();
        qualityButton.disabled = true;
        qualityLabel.textContent = '原画';
        resetVideoAspect();
        video.pause();
        video.removeAttribute('src');
        video.load();
        syncNativeControls();
        updateMobileProgress();
        updatePlaybackOverlay();
        if (!/^https?:\/\//i.test(source)) {
          fail('播放地址无效，请回到微信重新搜索。');
          fallback.removeAttribute('href');
          return;
        }
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = source;
          video.addEventListener('loadedmetadata', () => {
            if (loadTimer) clearTimeout(loadTimer);
            statusNode.textContent = '已连接，点击播放。';
            applyVideoAspect();
          }, { once: true });
        } else if (window.Hls && Hls.isSupported()) {
          hls = new Hls({ enableWorker: true, lowLatencyMode: false, maxBufferLength: 30 });
          hls.loadSource(source);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (loadTimer) clearTimeout(loadTimer);
            statusNode.textContent = '已连接，点击播放。';
            setupQualityMenu();
          });
          hls.on(Hls.Events.LEVEL_SWITCHED, () => updateQualityActive());
          hls.on(Hls.Events.ERROR, (_event, data) => {
            if (data && data.fatal) {
              if (loadTimer) clearTimeout(loadTimer);
              fail('资源站拒绝了浏览器直连，请点击“线路”使用备用播放器。');
            }
          });
        } else {
          fail('当前浏览器不支持 HLS，请使用备用播放器打开。');
        }
        fragment.set('ep', String(current + 1));
        history.replaceState(null, '', `${location.pathname}${location.search}#${fragment.toString()}`);
        updateButtons();
      };

      const renderEpisodes = () => {
        if (!playlist || playlist.episodes.length <= 1) {
          episodesNode.style.display = 'none';
          episodesNode.classList.remove('is-collapsed', 'is-expanded');
          episodeExpand.hidden = true;
          episodeGrid.replaceChildren();
          sheetEpisodeGrid.replaceChildren();
          return;
        }
        episodesNode.style.display = 'block';
        episodesExpanded = false;
        const canExpand = playlist.episodes.length > 10;
        episodesNode.classList.toggle('is-collapsed', canExpand);
        episodesNode.classList.remove('is-expanded');
        episodeExpand.hidden = !canExpand;
        episodeExpand.setAttribute('aria-expanded', 'false');
        episodeExpand.setAttribute('aria-label', canExpand ? '展开选集' : '展开选集');
        episodeGrid.replaceChildren();
        sheetEpisodeGrid.replaceChildren();
        playlist.episodes.forEach((item, index) => {
          [episodeGrid, sheetEpisodeGrid].forEach((grid) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'episode-item';
            button.textContent = String(item.name || `第${index + 1}集`);
            button.addEventListener('click', () => { closeEpisodeSheet(); loadEpisode(index); });
            grid.appendChild(button);
          });
        });
        updateButtons();
      };

      const selectRecommendation = (index) => {
        const selected = recommendationItems[index];
        if (!selected || !Array.isArray(selected.episodes) || !selected.episodes.length) return;
        playlist = selected;
        titleNode.textContent = String(playlist.title || '短剧播放');
        document.title = String(playlist.title || '短剧播放');
        watchStage.hidden = false;
        recommendationsNode.style.display = 'none';
        fragment.set('i', String(index));
        fragment.delete('ep');
        renderEpisodes();
        loadEpisode(0);
      };

      if (recommendationItems.length) {
        recommendationsNode.removeAttribute('hidden');
        recommendationsNode.style.display = 'block';
        const hasCompactEpisodes = recommendationItems.some(
          (item) => item.episodeCount > item.episodes.length,
        );
        const compactNotice = hasCompactEpisodes ? ' · 长剧点击后默认第1集' : '';
        recommendationsSummary.textContent = selectionKind === 'search'
          ? `共 ${recommendationItems.length} 个结果，按相关性排序${compactNotice}`
          : `共 ${recommendationItems.length} 部，按资源站更新时间排序${compactNotice}`;
        recommendationItems.forEach((item, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'recommend-card';
          const cover = document.createElement('div');
          cover.className = 'cover';
          cover.textContent = String(item.title || '剧').slice(0, 1);
          const coverUrl = String(item.cover || '').trim();
          if (/^https?:\/\//i.test(coverUrl)) {
            const image = document.createElement('img');
            image.src = coverUrl;
            image.alt = `${item.title || '短剧'}封面`;
            image.loading = 'lazy';
            image.referrerPolicy = 'no-referrer';
            cover.appendChild(image);
          }
          const badge = document.createElement('b');
          badge.textContent = String(index + 1);
          cover.appendChild(badge);
          const info = document.createElement('div');
          info.className = 'info';
          const name = document.createElement('strong');
          name.textContent = String(item.title || `作品${index + 1}`);
          const tags = document.createElement('div');
          tags.className = 'tags';
          [item.year, item.category, item.episodeCount > 1 ? `${item.episodeCount}集` : '完整版']
            .filter(Boolean)
            .forEach((value) => { const tag = document.createElement('span'); tag.textContent = String(value); tags.appendChild(tag); });
          const actor = String(item.actor || '').split(/[,，、/]+/).filter(Boolean).slice(0, 2).join('、');
          if (actor) {
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `主演：${actor}`;
            info.appendChild(meta);
          }
          const source = document.createElement('div');
          source.className = 'source';
          source.textContent = String(item.source || '未知来源');
          const play = document.createElement('div');
          play.className = 'play';
          play.innerHTML = `${selectionKind === 'search' ? '进入播放页' : '点击播放'} <span>›</span>`;
          info.append(name, tags, source, play);
          button.append(cover, info);
          button.addEventListener('click', () => selectRecommendation(index));
          recommendationGrid.appendChild(button);
        });
        statusNode.classList.remove('error');
        statusNode.textContent = '请选择要播放的作品。';
      }
      renderEpisodes();
      previous.addEventListener('click', () => loadEpisode(current - 1));
      next.addEventListener('click', () => loadEpisode(current + 1));
      retry.addEventListener('click', () => loadEpisode(current));
      episodeOpen.addEventListener('click', openEpisodeSheet);
      mobileEpisodeButton.addEventListener('click', openEpisodeSheet);
      mobileEpisodeButtonTop.addEventListener('click', openEpisodeSheet);
      pageBackButton.addEventListener('click', () => {
        if (history.length > 1) history.back();
      });
      pageMoreButton.addEventListener('click', () => mobileMoreButton.click());
      episodeExpand.addEventListener('click', () => {
        episodesExpanded = !episodesExpanded;
        episodesNode.classList.toggle('is-collapsed', !episodesExpanded);
        episodesNode.classList.toggle('is-expanded', episodesExpanded);
        episodeExpand.setAttribute('aria-expanded', String(episodesExpanded));
        episodeExpand.setAttribute('aria-label', episodesExpanded ? '收起选集' : '展开选集');
      });
      sheetBackdrop.addEventListener('click', closeEpisodeSheet);
      sheetClose.addEventListener('click', closeEpisodeSheet);
      qualityButton.addEventListener('click', (event) => {
        event.stopPropagation();
        if (qualityButton.disabled) return;
        mobileMoreMenu.hidden = true;
        qualityMenu.hidden = !qualityMenu.hidden;
        showControls();
        if (!qualityMenu.hidden) clearControlsHideTimer();
      });
      fullscreenButton.addEventListener('click', toggleFullscreen);
      mobileFullscreenButton.addEventListener('click', toggleFullscreen);
      mobileMuteButton.addEventListener('click', () => { video.muted = !video.muted; mobileMuteButton.classList.toggle('is-muted', video.muted); mobileMuteButton.setAttribute('aria-label', video.muted ? '取消静音' : '静音'); showControls(); });
      mobileMoreButton.addEventListener('click', (event) => {
        event.stopPropagation();
        qualityMenu.hidden = true;
        mobileMoreMenu.hidden = !mobileMoreMenu.hidden;
        showControls();
        if (!mobileMoreMenu.hidden) clearControlsHideTimer();
      });
      mobileMoreMenu.querySelectorAll('[data-rate]').forEach((button) => {
        button.addEventListener('click', () => {
          video.playbackRate = Number(button.dataset.rate) || 1;
          mobileMoreMenu.querySelectorAll('[data-rate]').forEach((item) => item.classList.toggle('active', item === button));
          mobileMoreMenu.hidden = true;
          showControls();
        });
      });
      mobileSeek.addEventListener('input', () => { if (Number.isFinite(video.duration) && video.duration > 0) video.currentTime = (Number(mobileSeek.value) / 1000) * video.duration; });
      video.addEventListener('timeupdate', updateMobileProgress);
      video.addEventListener('durationchange', updateMobileProgress);
      video.addEventListener('play', updatePlaybackOverlay);
      video.addEventListener('pause', updatePlaybackOverlay);
      const beginControlsInteraction = () => {
        controlsPointerActive = true;
        clearControlsHideTimer();
        showControls();
      };
      const endControlsInteraction = () => {
        controlsPointerActive = false;
        scheduleControlsHide();
      };
      mobileMoreMenu.addEventListener('pointerdown', beginControlsInteraction);
      mobileControls.addEventListener('pointerdown', beginControlsInteraction);
      window.addEventListener('pointerup', endControlsInteraction);
      window.addEventListener('pointercancel', endControlsInteraction);
      videoActions.addEventListener('pointerdown', (event) => {
        if (event.target.closest('button, input, .mobile-more-menu, .quality-menu')) beginControlsInteraction();
      }, true);
      document.addEventListener('click', (event) => {
        if (!qualityMenu.contains(event.target) && event.target !== qualityButton) {
          const wasOpen = !qualityMenu.hidden;
          qualityMenu.hidden = true;
          if (wasOpen) scheduleControlsHide();
        }
        if (!mobileMoreMenu.contains(event.target) && event.target !== mobileMoreButton) {
          const wasOpen = !mobileMoreMenu.hidden;
          mobileMoreMenu.hidden = true;
          if (wasOpen) scheduleControlsHide();
        }
      });
      video.addEventListener('click', (event) => {
        const fullscreen = document.fullscreenElement === videoShell || videoShell.classList.contains('pseudo-fullscreen');
        if (!mobileLayoutQuery.matches || fullscreen) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        if (videoActions.classList.contains('controls-hidden')) {
          showControls();
          return;
        }
        if (video.paused) video.play().catch(() => {});
        else video.pause();
      }, true);
      playbackOverlay.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (video.paused) video.play().catch(() => {});
        else video.pause();
        showControls();
      });
      document.addEventListener('fullscreenchange', () => { applyVideoAspect(); syncNativeControls(); });
      window.addEventListener('resize', () => { applyVideoAspect(); syncNativeControls(); });
      video.addEventListener('loadedmetadata', applyVideoAspect);
      video.addEventListener('ended', () => {
        if (autoNext.checked && playlist && current < playlist.episodes.length - 1) loadEpisode(current + 1);
      });
      syncNativeControls();
      updatePlaybackOverlay();
      if (playlist) {
        const initial = Math.max(0, Math.min(
          playlist.episodes.length - 1,
          Number.parseInt(fragment.get('ep') || '1', 10) - 1
        ));
        loadEpisode(Number.isFinite(initial) ? initial : 0);
      }
    })();
  </script>
</body>
</html>
