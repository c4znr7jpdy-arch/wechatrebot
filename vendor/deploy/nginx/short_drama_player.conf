# Public entry for the short-drama player.
# The VPS stores only short-lived selection metadata. The browser connects
# directly to the source HLS URL, so the VPS never proxies video bytes.

server {
    listen 80;
    listen [::]:80;
    server_name player.xiuxianjyj.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name player.xiuxianjyj.xin;

    ssl_certificate /etc/letsencrypt/live/player.xiuxianjyj.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/player.xiuxianjyj.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShortDramaTLS:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /short-drama/health {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '{"ok":true,"plugin":"jiang_short_drama","player":"selection-store"}';
    }

    location = /short-drama/api/selections {
        proxy_pass http://127.0.0.1:6198/selections;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        client_max_body_size 4m;
        add_header Cache-Control "no-store" always;
    }

    location ~ "^/short-drama/api/selections/([A-Za-z0-9_-]{16,96})$" {
        proxy_pass http://127.0.0.1:6198/selections/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    location = /short-drama/player {
        root /var/www/short-drama-player;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; media-src https: http: blob:; connect-src https: http:; img-src 'self' data: https: http:; base-uri 'none'; frame-ancestors 'self'" always;
    }

    location = /short-drama/player/ {
        return 301 /short-drama/player$is_args$args;
    }

    location / {
        return 404;
    }
}
