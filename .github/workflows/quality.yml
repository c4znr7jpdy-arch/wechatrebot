name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Validate release metadata
        run: python scripts/validate_release_metadata.py
      - name: Build and self-test frozen Windows manager
        run: python scripts/build_manager.py --output artifacts/ci-manager
