name: quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manager:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Verify independent source inputs
        run: python scripts/source_inputs.py
      - name: Validate release metadata
        run: python scripts/validate_release_metadata.py
      - name: Measure offline manager bootstrap
        run: python scripts/benchmark_manager_bootstrap.py --budget tests/fixtures/manager_bootstrap_budget.json --output artifacts/manager-bootstrap.json
      - name: Measure offline history query budget
        run: python scripts/benchmark_history_queries.py --rows 10000 --output artifacts/history-queries.json
      - name: Upload bootstrap performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-bootstrap-performance
          path: |
            artifacts/manager-bootstrap.json
            artifacts/history-queries.json
          if-no-files-found: ignore
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Report plugin regression collection
        run: python -m pytest --collect-only -q runtime/astrbot_plugin_twitter/tests
      - name: Test manager and plugin contracts
        run: python -m pytest -q -ra --ignore=tests/test_short_drama_player_controls.py --basetemp "${{ runner.temp }}/manager-tests" --junitxml "${{ runner.temp }}/manager-results.xml"
      - name: Upload manager test results and browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-test-evidence
          path: |
            ${{ runner.temp }}/manager-results.xml
            ${{ runner.temp }}/manager-tests/**/browser-failure/**
          if-no-files-found: ignore

  player:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Test player browser controls
        run: python -m pytest -q -ra tests/test_short_drama_player_controls.py --basetemp "${{ runner.temp }}/player-browser" --junitxml "${{ runner.temp }}/player-browser-results.xml"
      - name: Upload player browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-browser-evidence
          path: |
            ${{ runner.temp }}/player-browser/**/*.png
            ${{ runner.temp }}/player-browser-results.xml
          if-no-files-found: ignore

  frozen-manager:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: release/build-requirements.lock
      - name: Install Inno Setup for the bundled update window
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Inno Setup checksum mismatch' }
          $installer = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw "Inno Setup installation failed: $($installer.ExitCode)" }
      - name: Build and self-test frozen Windows manager
        run: python scripts/build_manager.py --output artifacts/ci-manager

  # Preserve the existing required check name while every independent job runs.
  test:
    needs: [manager, player, frozen-manager]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          $results = $env:QUALITY_RESULTS | ConvertFrom-Json
          $failed = @($results.PSObject.Properties | Where-Object { $_.Value.result -ne 'success' })
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Output "$($_.Name): $($_.Value.result)" }
            exit 1
          }
