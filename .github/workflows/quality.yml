name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Verify independent source inputs
        run: python scripts/source_inputs.py
      - name: Test
        run: python -m pytest -q -ra --ignore=tests/test_short_drama_player_controls.py
      - name: Test player browser controls
        run: python -m pytest -q -ra tests/test_short_drama_player_controls.py --basetemp "${{ runner.temp }}/player-browser" --junitxml "${{ runner.temp }}/player-browser-results.xml"
      - name: Upload player browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-browser-evidence
          path: |
            ${{ runner.temp }}/player-browser/**/*.png
            ${{ runner.temp }}/player-browser-results.xml
          if-no-files-found: ignore
      - name: Validate release metadata
        run: python scripts/validate_release_metadata.py
      - name: Build and self-test frozen Windows manager
        run: python scripts/build_manager.py --output artifacts/ci-manager
