name: quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manager: ${{ steps.plan.outputs.manager }}
      browser: ${{ steps.plan.outputs.browser }}
      player: ${{ steps.plan.outputs.player }}
      frozen: ${{ steps.plan.outputs.frozen }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select quality jobs
        id: plan
        env:
          QUALITY_EVENT: ${{ github.event_name }}
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/quality_ci.py plan

  manager:
    needs: plan
    if: needs.plan.outputs.manager == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Verify independent source inputs
        run: python scripts/source_inputs.py
      - name: Validate release metadata
        run: python scripts/validate_release_metadata.py
      - name: Measure offline manager bootstrap
        run: python scripts/benchmark_manager_bootstrap.py --budget tests/fixtures/manager_bootstrap_budget.json --output artifacts/manager-bootstrap.json
      - name: Measure offline history query budget
        run: python scripts/benchmark_history_queries.py --rows 10000 --output artifacts/history-queries.json
      - name: Upload bootstrap performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-bootstrap-performance
          path: |
            artifacts/manager-bootstrap.json
            artifacts/history-queries.json
          if-no-files-found: ignore
      - name: Report plugin regression collection
        run: python -m pytest --collect-only -q runtime/astrbot_plugin_twitter/tests
      - name: Test manager and plugin contracts
        run: python scripts/quality_ci.py run manager -q -ra --basetemp "${{ runner.temp }}/manager-tests" --junitxml "${{ runner.temp }}/manager-results.xml"
      - name: Upload manager test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-test-evidence
          path: ${{ runner.temp }}/manager-results.xml
          if-no-files-found: ignore

  browser:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
      - name: Install test browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: python -m playwright install chromium
      - name: Test manager browser interactions
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: python scripts/quality_ci.py run browser-${{ matrix.shard }} -q -ra --basetemp "${{ runner.temp }}/browser-${{ matrix.shard }}-tests" --junitxml "${{ runner.temp }}/browser-${{ matrix.shard }}-results.xml"
      - name: Upload browser test results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-browser-${{ matrix.shard }}-evidence
          path: |
            ${{ runner.temp }}/browser-${{ matrix.shard }}-results.xml
            ${{ runner.temp }}/browser-${{ matrix.shard }}-tests/**/browser-failure/**
          if-no-files-found: ignore

  player:
    needs: plan
    if: needs.plan.outputs.player == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
      - name: Install test browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: python -m playwright install chromium
      - name: Test player browser controls
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: python scripts/quality_ci.py run player -q -ra --basetemp "${{ runner.temp }}/player-browser" --junitxml "${{ runner.temp }}/player-browser-results.xml"
      - name: Upload player browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-browser-evidence
          path: |
            ${{ runner.temp }}/player-browser/**/*.png
            ${{ runner.temp }}/player-browser-results.xml
          if-no-files-found: ignore

  frozen-manager:
    needs: plan
    if: needs.plan.outputs.frozen == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: release/build-requirements.lock
      - name: Install Inno Setup for the bundled update window
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Inno Setup checksum mismatch' }
          $installer = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw "Inno Setup installation failed: $($installer.ExitCode)" }
      - name: Build and self-test frozen Windows manager
        run: python scripts/build_manager.py --output artifacts/ci-manager

  # Preserve the existing required check name and reject unexpected skipped jobs.
  test:
    needs: [plan, manager, browser, player, frozen-manager]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require every selected quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/quality_ci.py gate
