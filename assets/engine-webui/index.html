<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地回复服务</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f8fafd;color:#18263a;font:14px/1.7 "Microsoft YaHei UI","Segoe UI",sans-serif}.panel{width:min(520px,calc(100vw - 48px));padding:34px;border:1px solid #d7dee8;background:#fff}.mark{width:42px;height:42px;display:grid;place-items:center;margin-bottom:20px;border-radius:50%;background:#eaf7f1;color:#16845b;font-size:24px;font-weight:700}h1{margin:0 0 8px;color:#102a49;font-size:24px}p{margin:0;color:#6b7789}.tip{margin-top:22px;padding-top:18px;border-top:1px solid #d7dee8;color:#1769e8}
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark" aria-hidden="true">✓</div>
    <h1>本地回复服务正在运行</h1>
    <p>这是机器人内部服务地址，无需在浏览器中操作。</p>
    <p class="tip">请返回桌面管理器，在“功能扩展”中打开功能配置中心。</p>
  </main>
</body>
</html>
